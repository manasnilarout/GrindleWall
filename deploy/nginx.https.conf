# TLS front for grindelwald.magickvoice.com.
#
# docker-compose.https.yml mounts this over /etc/nginx/conf.d/default.conf,
# replacing nginx.conf. The certificate must already exist — nginx refuses to
# start without it — so the first one is issued under the plain-HTTP stack.
# deployment-guide.md, "HTTPS on a VM", has the whole sequence.
#
# The server body below is nginx.conf's, with TLS in front. They are two
# copies on purpose: only one is ever loaded, and a config that has to be
# read at 3am is worth more than a shared include. **Change both** if you
# touch the proxy settings — the buffering and timeout lines are what make
# the latency numbers real.
#
# To serve a different hostname, replace grindelwald.magickvoice.com in the
# three directives below — server_name and the two certificate paths — and
# issue a certificate for that name.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Port 80: the ACME challenge, and a redirect for everything else. The
# challenge location comes first and is a `^~` prefix match, so it wins over
# the redirect — an http-01 challenge that gets 301'd to HTTPS fails.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # HTTP/2 for the page and its assets. It does not touch /ws/session:
    # nginx does not advertise RFC 8441 extended CONNECT, so a browser opens
    # the WebSocket on a separate HTTP/1.1 connection, and the upstream leg is
    # pinned to 1.1 below regardless. Verified: 101 through this listener.
    http2 on;
    server_name grindelwald.magickvoice.com;

    ssl_certificate     /etc/letsencrypt/live/grindelwald.magickvoice.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grindelwald.magickvoice.com/privkey.pem;

    # Written out rather than including certbot's options-ssl-nginx.conf:
    # that file only lands when certbot's nginx *installer* plugin runs, and
    # we issue with --webroot, which never touches nginx's config.
    ssl_protocols TLSv1.2 TLSv1.3;
    # nginx's default cipher list (HIGH:!aNULL:!MD5) still admits static-RSA
    # suites like AES128-SHA — no forward secrecy — and the client picks,
    # because prefer_server_ciphers is off. This is Mozilla's intermediate
    # list: every suite is ECDHE or DHE. TLS 1.3 ignores it and uses its own.
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 8m;

    # Docker Compose embedded DNS. ipv6=off: the compose network is IPv4.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # One year, this host only. No includeSubDomains and no preload: those
    # commit names we may not control. Note that it IS a commitment — once a
    # browser has seen this it will refuse plain HTTP here for a year, so
    # reverting to the HTTP stack takes the site down rather than downgrading
    # it. deployment-guide.md says so where it matters.
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /api {
        set $backend backend:8787;
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        # Session WAVs are Range-served by Express; pass the header through.
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
    }

    # wss:// arrives here. The browser picks ws: vs wss: from
    # location.protocol, so nothing in the app changes for TLS.
    location /ws/ {
        set $backend backend:8787;
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri $uri/ /index.html;
    }
}
